name: Raspberry Pi image

# Builds the flashable Edgebox image inside a Mjolnir CI VM. The runner
# label ubuntu-24.04 is the ci-ubuntu-24.04 guest, whose kernel cannot
# parse MBR. The builder mounts partitions by offset.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/raspi/**'
      - '.forgejo/workflows/raspi-image.yml'
      - 'mjolnir.toml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl dosfstools e2fsprogs fdisk rsync xz-utils

      - name: Static checks and partition mount
        run: infrastructure/raspi/image/tests/static.sh

      - name: Build image
        run: infrastructure/raspi/image/bin/mjolnir-build

      - name: Publish to the blob door
        env:
          EDGEBOX_PUBLISH_TOKEN: ${{ secrets.EDGEBOX_PUBLISH_TOKEN }}
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check 'blake3==1.0.8'
          infrastructure/raspi/image/bin/publish-blob dist/raspi/*.img.xz
